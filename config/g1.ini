; G1 velocity-command locomotion (mujoco-ultra-fast Phase 1).
; Provenance: vec sizing from the Phase-0 wall (48-core H100 host, CPU
; stepping peak @ nroll=4096); reward weights = legged-gym-style defaults
; (mirrored in g1_set_default_config); train block starts from drone.ini
; (PufferLib's continuous-control reference) with locomotion-informed
; gamma/horizon. Expect Protein sweep to move most of [train].

[base]
env_name = g1

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 48

[env]
action_scale = 0.5
max_episode_len = 1000
w_track_lin = 1.0
w_track_ang = 0.5
w_lin_vel_z = -2.0
w_ang_vel_xy = -0.05
w_orientation = -5.0
w_torque = -2e-5
w_action_rate = -0.01
w_alive = 0.25
w_termination = -1.0

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 100000000
learning_rate = 0.0097
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 1.0
vf_clip_coef = 0.2
max_grad_norm = 0.7
ent_coef = 0.005
beta1 = 0.9
beta2 = 0.999
eps = 1e-12
minibatch_size = 32768
horizon = 64
vtrace_rho_clip = 3.0
vtrace_c_clip = 3.0
prio_alpha = 0.4
prio_beta0 = 1

[sweep]
method = Protein
metric = perf

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 3e8
mean = 1e8
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 1e-4
max = 5e-2
mean = 1e-2

[sweep.train.ent_coef]
distribution = log_normal
min = 1e-5
max = 5e-2
mean = 5e-3

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.999
mean = 0.99

[sweep.env.w_track_ang]
distribution = log_normal
min = 0.1
max = 2.0
mean = 0.5

