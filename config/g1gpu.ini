; G1 GPU-NATIVE locomotion (mujoco-ultra-fast Phase 3): envs step
; entirely on the GPU (ocean/g1gpu staged CUDA engine). Train block
; = Phase-1 best config baked in.
; Provenance: vec sizing from the Phase-0 wall (48-core H100 host, CPU
; stepping peak @ nroll=4096); reward weights = legged-gym-style defaults
; (mirrored in g1_set_default_config); train block starts from drone.ini
; (PufferLib's continuous-control reference) with locomotion-informed
; gamma/horizon. Expect Protein sweep to move most of [train].

[base]
env_name = g1gpu

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 2

[env]
action_scale = 0.5
max_episode_len = 1000
w_track_lin = 2.5
w_track_ang = 1.25
w_lin_vel_z = -2.0
w_ang_vel_xy = -0.05
w_orientation = -5.0
w_torque = -2e-5
w_action_rate = -0.01
w_alive = 25.0
w_termination = -1.0

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[train]
gpus = 1
seed = 42
; 1-min campaign (docs/sweep_1min.md): trials run LONG (300M) so Constellation
; slices perf@100M (v2s) / 135M (v25) post-hoc from a single sweep.
; total_timesteps is NOT swept — the budget is the constraint, not a variable.
total_timesteps = 300000000
learning_rate = 0.002
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.995
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 1.0
vf_clip_coef = 20
max_grad_norm = 0.7
ent_coef = 1e-4
beta1 = 0.9
beta2 = 0.999
eps = 1e-12
minibatch_size = 32768
horizon = 64
vtrace_rho_clip = 3.0
vtrace_c_clip = 3.0
prio_alpha = 0.4
prio_beta0 = 1

[sweep]
method = Protein
; metric=perf -> Protein optimizes env/perf (lin-vel tracking kernel, 0-1, the
; frozen walk metric) NOT env/score (raw return, dominated by w_alive=25).
; Requires the pufferl.py:384 fix that honors target_key.
metric = perf
goal = maximize
; single-GPU sweep. gpus=0 (default.ini) makes pufferl probe
; /proc/driver/nvidia/gpus, which is absent on Modal containers -> crash.
gpus = 1
; 30 bins over a 300M trial ~= 10M/bin -> fine enough to slice perf@100M / 135M
; post-hoc in Constellation (default 5 bins is too coarse for the slice trick).
downsample = 30
; default.ini's ~20 [sweep.*] spaces merge in; sweep_only filters by SUBSTRING
; on leaf names, so tokens are chosen to avoid collisions (e.g. clip_coef is
; NOT swept — it'd also match vf_clip_coef; ent_coef/vf_coef do not collide).
; Track A = SPS-neutral-ish PPO knobs. SPS-changing knobs (replay_ratio,
; horizon) are fair game because Constellation slices on wall-uptime, which
; captures each trial's true SPS. Net size / minibatch fixed (avoid changing
; the .bin shape mid-campaign + the minibatch|batch divisibility coupling).
sweep_only = learning_rate, ent_coef, gamma, gae_lambda, vf_coef, max_grad_norm, replay_ratio, horizon

[sweep.train.learning_rate]
distribution = log_normal
min = 3e-4
max = 2e-2
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 1e-5
max = 2e-2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.97
max = 0.999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.90
max = 0.99
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.5
max = 4.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.3
max = 2.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

; uniform_pow2 -> {32, 64, 128}. minibatch_size=32768 divides 8192*{32,64,128},
; so every sampled horizon keeps minibatch|batch integer (no trainer assert).
[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

