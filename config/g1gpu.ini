; G1 GPU-NATIVE locomotion (mujoco-ultra-fast Phase 3): envs step
; entirely on the GPU (ocean/g1gpu staged CUDA engine). Train block
; = Phase-1 best config baked in.
; Provenance: vec sizing from the Phase-0 wall (48-core H100 host, CPU
; stepping peak @ nroll=4096); reward weights = legged-gym-style defaults
; (mirrored in g1_set_default_config); train block starts from drone.ini
; (PufferLib's continuous-control reference) with locomotion-informed
; gamma/horizon. Expect Protein sweep to move most of [train].

[base]
env_name = g1gpu

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 2

[env]
action_scale = 0.5
max_episode_len = 1000
w_track_lin = 2.5
w_track_ang = 1.25
w_lin_vel_z = -2.0
w_ang_vel_xy = -0.05
w_orientation = -5.0
w_torque = -2e-5
w_action_rate = -0.01
w_alive = 25.0
w_termination = -1.0

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 100000000
learning_rate = 0.002
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.995
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 1.0
vf_clip_coef = 20
max_grad_norm = 0.7
ent_coef = 1e-4
beta1 = 0.9
beta2 = 0.999
eps = 1e-12
minibatch_size = 32768
horizon = 64
vtrace_rho_clip = 3.0
vtrace_c_clip = 3.0
prio_alpha = 0.4
prio_beta0 = 1

[sweep]
method = Protein
metric = perf
; default.ini's ~20 [sweep.*] spaces merge in via configparser; restrict the
; search to the 5-dim gait sweep (filter matches leaf names by substring)
sweep_only = total_timesteps, learning_rate, ent_coef, gamma, w_track_ang

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 3e8
mean = 1e8
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 1e-4
max = 5e-2
mean = 1e-2
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 1e-5
max = 5e-2
mean = 5e-3
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.999
mean = 0.99
scale = auto

[sweep.env.w_track_ang]
distribution = log_normal
min = 0.1
max = 2.0
mean = 0.5
scale = auto

